name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main-latest
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Unit tests and lint
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug

      - name: Resolve release metadata
        id: meta
        run: |
          echo "tag_name=main-latest" >> "$GITHUB_OUTPUT"
          echo "release_name=Main Latest" >> "$GITHUB_OUTPUT"
          echo "asset_prefix=main-latest" >> "$GITHUB_OUTPUT"

      - name: Validate release signing secrets
        env:
          PROTATO_KEYSTORE_BASE64: ${{ secrets.PROTATO_KEYSTORE_BASE64 }}
          PROTATO_KEYSTORE_PASSWORD: ${{ secrets.PROTATO_KEYSTORE_PASSWORD }}
          PROTATO_KEY_ALIAS: ${{ secrets.PROTATO_KEY_ALIAS }}
          PROTATO_KEY_PASSWORD: ${{ secrets.PROTATO_KEY_PASSWORD }}
        run: |
          missing=0
          for key in \
            PROTATO_KEYSTORE_BASE64 \
            PROTATO_KEYSTORE_PASSWORD \
            PROTATO_KEY_ALIAS \
            PROTATO_KEY_PASSWORD
          do
            if [ -z "${!key}" ]; then
              echo "::error::$key is required for release builds"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Decode release keystore
        env:
          PROTATO_KEYSTORE_BASE64: ${{ secrets.PROTATO_KEYSTORE_BASE64 }}
        run: |
          echo "$PROTATO_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/protato-release.jks"

      - name: Build signed release APK
        env:
          PROTATO_KEYSTORE_PATH: ${{ runner.temp }}/protato-release.jks
          PROTATO_KEYSTORE_PASSWORD: ${{ secrets.PROTATO_KEYSTORE_PASSWORD }}
          PROTATO_KEY_ALIAS: ${{ secrets.PROTATO_KEY_ALIAS }}
          PROTATO_KEY_PASSWORD: ${{ secrets.PROTATO_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Create source archive
        run: |
          git archive --format=zip --output "protato-${{ steps.meta.outputs.asset_prefix }}-source.zip" HEAD

      - name: Prepare release assets
        run: |
          cp app/build/outputs/apk/release/app-release.apk "protato-${{ steps.meta.outputs.asset_prefix }}-release.apk"

      - name: Update rolling release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ steps.meta.outputs.tag_name }}" "$GITHUB_SHA"
          git push origin "refs/tags/${{ steps.meta.outputs.tag_name }}" --force

      - name: Write main release notes
        run: |
          {
            echo "## Main branch auto release"
            echo
            echo "- Branch: \`main\`"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Built at: $(date -u +"%Y-%m-%d %H:%M UTC")"
            echo
            echo "## Included commits"
            jq -r '.commits[] | "- `\(.id[0:7])` \((.message | split("\n")[0]))"' "$GITHUB_EVENT_PATH"
            echo
            echo "## Artifacts"
            echo "- \`protato-${{ steps.meta.outputs.asset_prefix }}-release.apk\`"
            echo "- \`protato-${{ steps.meta.outputs.asset_prefix }}-source.zip\`"
          } > release-notes.md

      - name: Publish rolling main release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_name }}
          prerelease: true
          body_path: release-notes.md
          files: |
            protato-${{ steps.meta.outputs.asset_prefix }}-release.apk
            protato-${{ steps.meta.outputs.asset_prefix }}-source.zip
